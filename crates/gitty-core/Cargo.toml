[package]
name = "gitty-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core domain logic for Gitty — no framework dependencies"

[dependencies]
dirs = "6.0.0"
dunce = "1.0.5"
git2 = { version = "0.21.0", default-features = false }
rayon = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde", "serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5.0"
battery = "0.7"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[dev-dependencies]
tempfile = "3.27.0"
