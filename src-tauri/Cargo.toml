[package]
name = "gitty-tauri"
version = "0.1.0"
edition = "2021"
authors = ["Caio Mestres"]
license = "MIT"
description = "Tauri desktop application for Gitty"

[lib]
name = "gitty_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitty-core = { path = "../crates/gitty-core", features = ["liveness"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3.47", features = ["formatting", "parsing", "serde", "serde-well-known"] }
notify = "7"

[dev-dependencies]
tempfile = "3"
