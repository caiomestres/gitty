[package]
name = "gitty-tauri"
version = "0.1.0"
edition = "2021"
authors = ["Caio Mestres"]
license = "MIT"
description = "Tauri desktop application for Gitty"

[lib]
name = "gitty_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitty-core = { path = "../crates/gitty-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
